<!DOCTYPE html>
<html>
<head>
    <title>My Weather App</title>

    <style>
        body {
            background-color: skyblue;
            font-family: Arial;
            text-align: center;
            color: white;
        }

        .weather {
            background-color: dodgerblue;
            border: 2px solid white;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
        }

        #temp {
            font-size: 40px;
            font-weight: bold;
            color: yellow;
        }

        .forecast {
            background-color: white;
            color: black;
            padding: 15px;
            margin: 20px auto;
            width: 400px;
        }

        .day {
            border-bottom: 1px solid gray;
            padding: 5px;
        }
    </style>
</head>

<body>

    <h1>My Weather App</h1>
    <p>Check today's weather!</p>

    <div class="weather">
        <h2>Today's Weather</h2>
        <p>☁️ Partly Cloudy</p>
        <p id="temp">28°C</p>
        <p>City: islamabad</p>
        <p>Humidity: 62%</p>
    </div>

    <div class="forecast">
        <h2>Weekly Forecast</h2>

        <p class="day">Monday: Sunny - 30°C</p>
        <p class="day">Tuesday: Cloudy - 27°C</p>
        <p class="day">Wednesday: Rainy - 24°C</p>
        <p class="day">Thursday: Windy - 26°C</p>
        <p class="day">Friday: Stormy - 23°C</p>
    </div>

</body>
</html>
