<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cartoon Character Card</title>

  <style>

    * {
      font-size: 16px;
    }

    body {
      background-color: rgb(7, 181, 250);
    }

    h1 {
      color: rgb(6, 6, 252);
    }

    h2 {
      color: rgb(246, 7, 94);
    }

    p {
      color: rgb(56, 21, 21);
    }

    .cartoon-detail {
      color: rgb(146, 217, 240);
      font-weight: bold;
    }

    #cartoon-card {
      background-color: lightcyan;
    }

  </style>

</head>
<body>

  <h1>My Cartoon Character Card</h1>

  <p style="color: crimson;">Meet my favourite cartoon character!</p>

  <div id="cartoon-card">

    <h2>About My Character</h2>

    <p class="cartoon-detail">Character Name: mr bean</p>
    <p class="cartoon-detail">Best Friend: teddy</p>
    <p class="cartoon-detail">Favourite thing: his car</p>
  </div>

  <h2>Why I Like This Character</h2>

  <p>Mr. Bean is kind, helpful, and funny.</p>
  <p>He always tries to make us laugh</p>
  
</body>
</html>
