<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank App</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="bank-container">
    <h1>My Bank App</h1>
    
    <!-- Balance Display -->
    <div class="balance-section">
      <h2>Current Balance</h2>
      <p class="balance-amount">$<span id="balance">1000</span></p>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <label for="amount">Enter Amount:</label>
      <input type="number" id="amount" placeholder="e.g. 500">
    </div>

    <!-- Action Buttons -->
    <div class="button-section">
      <button id="credit-btn" class="btn credit">Credit</button>
      <button id="debit-btn" class="btn debit">Debit</button>
    </div>
  </div>

  <!-- script.js linked at the bottom of body -->
  <script src="index.js"></script>
</body>
</html>
