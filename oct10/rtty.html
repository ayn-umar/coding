<!DOCTYPE html>
<html>
<head>
  <title>School Club Website</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>

      background-color: #d3abab;

    .club-card h3 {
      color: #471711;
    }

<body>

  <h1>school subjects </h1>

 
  <div class="container">

   
    <div class="row">

      
      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>mathmatics</h3>
          <p>I enjoy solving problems and learning about numbers and shapes.</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>English</h3>
          <p>I enjoy reading books, writing stories, and improving my communication skills.</p>
        </div>
      </div>

      <div class="col-12 col-md-12 col-lg-4">
        <div class="club-card">
          <h3>chemistry</h3>
                    <p>I love doing chemistry experiments and learning about different elements.</p>
                    </div>
      </div>

    </div>
  </div>

</html>
